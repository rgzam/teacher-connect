services:
  postgres:
    image: postgres:16-alpine
    container_name: teacherconnect-postgres
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: teacherconnect
      POSTGRES_PASSWORD: teacherconnect
      POSTGRES_DB: teacherconnect
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U teacherconnect -d teacherconnect"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    profiles: ["app"]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "127.0.0.1:3001:3001"
    environment:
      DATABASE_URL: postgresql://teacherconnect:teacherconnect@postgres:5432/teacherconnect?schema=public
      JWT_SECRET: ${JWT_SECRET:-replace-this-with-a-long-random-string}
      API_PORT: "3001"
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost:3001/api/calendar/oauth/callback}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      EMAIL_FROM: ${EMAIL_FROM:-TeacherConnect <no-reply@teacherconnect.local>}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/api/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    profiles: ["app"]
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        API_INTERNAL_URL: http://api:3001
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      API_INTERNAL_URL: http://api:3001
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
