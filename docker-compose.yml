services:
  postgres:
    image: postgres:16-alpine
    container_name: teacherconnect-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: teacherconnect
      POSTGRES_PASSWORD: teacherconnect
      POSTGRES_DB: teacherconnect
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U teacherconnect -d teacherconnect"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
